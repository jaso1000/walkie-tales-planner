services:
  planner:
    image: ghcr.io/jaso1000/walkie-tales-planner:latest
    build: .
    container_name: walkie-tales-planner
    restart: unless-stopped
    ports:
      - "8475:8475"
    volumes:
      - ./data:/data
      # For "Sync to player" to copy from the collection drive: plug it into the server, then uncomment these
      # (with the drive's mount point) and the environment lines below.
      # - /mnt/collection:/drive:ro
    # environment:
    #   - DRIVE_DIR=/drive
